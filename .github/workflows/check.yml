name: Validate MASAR BMW
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check app.js
          node --check visuals.js
          node --check study-hub.js
          node --check traffic-signs.js
          node --check validate-dataset.js
          node --check db/indexeddb.js
          node --check smoke-test.js
      - name: Validate curriculum and routes
        run: |
          node validate-dataset.js
          node smoke-test.js
      - name: Compile standalone site and assert published HTML is synchronized
        run: |
          python compile.py
          git diff --exit-code -- index.html
