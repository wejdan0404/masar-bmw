name: Import user-selected BMW image
on:
  push:
    branches:
      - design/hero-selected-bmw-oct14
    paths:
      - .github/workflows/import-user-selected-bmw.yml
permissions:
  contents: write
jobs:
  import-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obtain approved transparent BMW and optimize it
        env:
          IMAGE_URL: 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JlfKRLWyLQcUf3XCT6v4PVFhAa/bb464191-532e-4e7e-8e29-1419ccfb4a18.png'
          EXPECTED_SHA: '2470f3628b5a15aaaf68c2e8292118c1f0e436ad2b71e3e4f41e9c088a4a2f15'
        run: |
          python -m pip install --quiet pillow
          curl --fail --silent --show-error --location --retry 3 "$IMAGE_URL" -o /tmp/selected-bmw.png
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          from PIL import Image
          src=Path('/tmp/selected-bmw.png')
          digest=hashlib.sha256(src.read_bytes()).hexdigest()
          assert digest==os.environ['EXPECTED_SHA'],f'Unexpected user image content: {digest}'
          im=Image.open(src).convert('RGBA')
          assert im.getchannel('A').getextrema()[0]==0,'Image must have transparent background'
          im.thumbnail((960,1051),Image.Resampling.LANCZOS)
          out=Path('assets/masar-bmw-selected.webp')
          out.parent.mkdir(parents=True,exist_ok=True)
          im.save(out,'WEBP',quality=78,method=5)
          verify=Image.open(out)
          assert verify.mode=='RGBA' and verify.getchannel('A').getextrema()[0]==0
          print('Selected BMW asset:',out,verify.size,out.stat().st_size,'bytes')
          PY
      - name: Commit optimized image into repository branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/masar-bmw-selected.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add approved transparent BMW hero image to local assets"
          git push origin HEAD:design/hero-selected-bmw-oct14
