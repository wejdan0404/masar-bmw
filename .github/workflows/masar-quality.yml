name: Masar quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check study-coach.js
          node --check traffic-signs.js
          node --check study-hub.js
          node --check visuals.js
          node --check db/indexeddb.js
          node --check smoke-test.js
          node --check validate-dataset.js
          node --check browser-e2e.js
      - name: Validate content and compiled site
        run: node validate-dataset.js
      - name: Run smoke tests
        run: node smoke-test.js
      - name: Rebuild standalone site
        run: python compile.py
      - name: Ensure published HTML is reproducible
        run: git diff --exit-code -- index.html
