<script>/*
 * MASAR BMW — IndexedDB offline storage.
 * Structured on-device database (NOT a remote sync service).
 * Educational content comes from the versioned, read-only course.json.
 */
(() => {
  'use strict';
  const DATABASE_NAME = 'masar-bmw-study';
  const DATABASE_VERSION = 2;
  const referenceStores = ['weeks', 'lessons', 'questions', 'sources', 'learning_visuals', 'media_resources'];
  const userStores = ['progress', 'answers', 'notes', 'bookmarks', 'attempts', 'visits', 'preferences'];
  const allStores = [...referenceStores, ...userStores];
  let dbPromise;
  let writeQueue = Promise.resolve();

  function connect() {
    if (!('indexedDB' in window)) return Promise.reject(new Error('IndexedDB unavailable'));
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const request = indexedDB.open(DATABASE_NAME, DATABASE_VERSION);
      request.onupgradeneeded = () => {
        const db = request.result;
        const create = (name, keyPath, indexes = []) => {
          if (db.objectStoreNames.contains(name)) return;
          const store = db.createObjectStore(name, { keyPath });
          indexes.forEach(([field, unique]) => store.createIndex(field, field, { unique: !!unique }));
        };
        create('weeks', 'id', [['number', true]]);
        create('lessons', 'id', [['week_id', false], ['order', true]]);
        create('questions', 'id', [['lesson_id', true]]);
        create('sources', 'id');
        create('learning_visuals', 'id');
        create('media_resources', 'id');
        create('progress', 'lesson_id');
        create('answers', 'question_id');
        create('notes', 'lesson_id');
        create('bookmarks', 'lesson_id');
        create('attempts', 'id');
        create('visits', 'lesson_id');
        create('preferences', 'key');
      };
      request.onsuccess = () => {
        const db = request.result;
        db.onversionchange = () => db.close();
        resolve(db);
      };
      request.onerror = () => { dbPromise = undefined; reject(request.error); };
      request.onblocked = () => console.warn('MASAR: IndexedDB upgrade blocked by another tab');
    });
    return dbPromise;
  }

  function completed(tx) {
    return new Promise((resolve, reject) => {
      tx.oncomplete = () => resolve();
      tx.onabort = () => reject(tx.error || new Error('Database transaction aborted'));
      tx.onerror = () => reject(tx.error || new Error('Database transaction failed'));
    });
  }
  function getAll(store) {
    return new Promise((resolve, reject) => {
      const request = store.getAll();
      request.onsuccess = () => resolve(request.result || []);
      request.onerror = () => reject(request.error);
    });
  }

  async function seedReference(course) {
    const db = await connect();
    const tx = db.transaction(referenceStores, 'readwrite');
    for (const name of referenceStores) {
      const store = tx.objectStore(name);
      store.clear();
      for (const item of course[name] || []) store.put(item);
    }
    await completed(tx);
    return { weeks: (course.weeks || []).length, lessons: (course.lessons || []).length,
      questions: (course.questions || []).length, sources: (course.sources || []).length,
      visuals: (course.learning_visuals || []).length, media: (course.media_resources || []).length };
  }

  async function loadUser() {
    const db = await connect();
    const tx = db.transaction(userStores, 'readonly');
    const results = await Promise.all(userStores.map(n => getAll(tx.objectStore(n))));
    await completed(tx);
    const [progress, answers, notes, bookmarks, attempts, visits, preferences] = results;
    const prefs = Object.fromEntries(preferences.map(item => [item.key, item.value]));
    if (!prefs.initialized) return null;
    return {
      done: progress.filter(x => x.completed).map(x => x.lesson_id),
      answers: Object.fromEntries(answers.map(x => [x.question_id, x.option_index])),
      notes: Object.fromEntries(notes.map(x => [x.lesson_id, x.body])),
      bookmarks: bookmarks.map(x => x.lesson_id),
      history: attempts.sort((a,b) => a.id-b.id).map(({id, ...attempt}) => attempt),
      visited: visits.map(x => x.lesson_id),
      lastOpened: prefs.lastOpened || 1,
      readingPositions: prefs.readingPositions || {}
    };
  }

  async function doSave(snapshot) {
    const db = await connect();
    const tx = db.transaction(userStores, 'readwrite');
    for (const name of userStores) tx.objectStore(name).clear();
    for (const lesson_id of snapshot.done || []) tx.objectStore('progress').put({lesson_id: Number(lesson_id), completed: true});
    for (const [question_id, option_index] of Object.entries(snapshot.answers || {}))
      tx.objectStore('answers').put({question_id, option_index: Number(option_index)});
    for (const [lesson_id, body] of Object.entries(snapshot.notes || {}))
      if (body) tx.objectStore('notes').put({lesson_id: Number(lesson_id), body: String(body)});
    for (const lesson_id of snapshot.bookmarks || []) tx.objectStore('bookmarks').put({lesson_id: Number(lesson_id)});
    (snapshot.history || []).forEach((entry,id) => tx.objectStore('attempts').put({id, ...entry}));
    for (const lesson_id of snapshot.visited || []) tx.objectStore('visits').put({lesson_id: Number(lesson_id)});
    tx.objectStore('preferences').put({key: 'initialized', value: true});
    tx.objectStore('preferences').put({key: 'lastOpened', value: Number(snapshot.lastOpened) || 1});
    tx.objectStore('preferences').put({key: 'readingPositions', value: snapshot.readingPositions || {}});
    await completed(tx);
  }

  function saveUser(snapshot) {
    // Snapshot eagerly; subsequent UI mutations must not alter an in-flight transaction.
    const copied = JSON.parse(JSON.stringify(snapshot));
    writeQueue = writeQueue.catch(() => {}).then(() => doSave(copied));
    return writeQueue;
  }

  window.MasarDB = Object.freeze({name: DATABASE_NAME, connect, seedReference, loadUser, saveUser,
    stores: Object.freeze(allStores.slice())});
})();

function lessonPage(n){const l=getLesson(n);if(!l)return notFound();const changed=state.lastOpened!==n||!(state.visited||[]).includes(n);state.lastOpened=n;state.visited=state.visited||[];if(!state.visited.includes(n))state.visited.push(n);if(changed&&(savedMirrorPresent||databaseReady||dirtyBeforeReady))save();let c=l.study_content,q=getQuestion(n),ans=state.answers[q.id],answered=Number.isInteger(ans),correct=ans===q.correct_option_index;return `<div class="crumbs"><a href="#/weeks">الخطة</a> / <a href="#/week/${l.week}">الأسبوع ${l.week}</a> / الدرس ${p2(n)}</div><div class="lesson-layout"><div class="lesson-main"><section class="lesson-hero"><div class="flexline"><span class="chip tiny dark">LESSON ${p2(n)} / 48</span><span class="chip tiny">${l.estimated_minutes} دقيقة مقترحة</span></div><h1>${ESC(l.title)}</h1><p>${ESC(c.goal)}</p></section><section class="lesson-body" id="reading"><div class="eyebrow">01 / الفكرة الأساسية</div><h2>نفهمها أولًا</h2><p>${ESC(c.introduction)}</p><div class="eyebrow" style="margin-top:24px">02 / معلومات تثبّتينها</div>${c.key_points.map((t,i)=>`<div class="point"><i>${i+1}</i><span>${ESC(t)}</span></div>`).join('')}</section>${visualBlock(l)}<section class="scenario" id="scenario"><div class="tag-s">DRIVE THINKING · تمرين تفكير</div><h2>تخيّلي الموقف</h2><p>${ESC(c.scenario)}</p></section><section class="qbox" id="practice"><div class="eyebrow">03 / اختبري الفهم</div><h2>قرار واحد صحيح</h2><p>${ESC(q.question)}</p><div class="options">${q.options.map((opt,i)=>`<button type="button" class="option ${answered?(i===q.correct_option_index?'correct':i===ans?'wrong':''):''}" data-action="lesson-answer" data-id="${n}" data-choice="${i}" ${answered?'disabled':''}><span class="bullet">${p2(i+1)}</span>${ESC(opt)}</button>`).join('')}</div>${answered?`<div class="feedback ${correct?'':'wrong'}"><strong>${correct?'إجابة صحيحة!':'خلينا نفهم السبب:'}</strong> ${ESC(q.rationale)}</div>`:''}<div class="lesson-footer"><button type="button" class="btn ${isDone(n)?'btn-muted':'btn-primary'}" data-action="mark" data-id="${n}">${icon('check')} ${isDone(n)?'تم إكمال الدرس · إلغاء العلامة':'أكملت هذا الدرس'}</button><button type="button" class="btn btn-outline" data-action="bookmark" data-id="${n}">${icon('star')} ${state.bookmarks.includes(n)?'إزالة الحفظ':'حفظ للمراجعة'}</button></div></section><section class="lesson-body note-box" id="notes"><div class="eyebrow">04 / دفتر ملاحظاتي</div><h2>اكتبيها بطريقتك</h2><p>ملاحظاتك تُحفظ محليًا على نفس المتصفح، ويمكنك تصديرها من الإعدادات.</p><textarea data-note="${n}" placeholder="وش أهم شيء فهمتيه؟ أو وش تبغين تراجعينه؟">${ESC(state.notes[n]||'')}</textarea></section><div class="lesson-footer" style="margin-top:20px"><a href="#/lesson/${Math.max(1,n-1)}" class="btn btn-outline" ${n===1?'aria-disabled="true"':''}>← الدرس السابق</a><a href="${n===48?'#/weeks':`#/lesson/${n+1}`}" class="btn btn-primary">${n===48?'العودة للخطة':'الدرس التالي'} ${icon('left')}</a></div></div><aside class="lesson-aside"><section class="aside-card"><h3>في هذا الدرس</h3><button type="button" class="toc-item" data-action="scroll" data-target="reading">الفكرة الأساسية</button>${(COURSE.learning_visuals||[]).some(v=>(v.lesson_ids||[]).includes(l.id))?'<button type="button" class="toc-item" data-action="scroll" data-target="visual-learning">الشرح المرئي</button>':''}<button type="button" class="toc-item" data-action="scroll" data-target="scenario">الموقف التطبيقي</button><button type="button" class="toc-item" data-action="scroll" data-target="practice">سؤال الفهم</button><button type="button" class="toc-item" data-action="scroll" data-target="notes">ملاحظاتي</button><div class="microbar"><span style="width:${isDone(n)?100:0}%"></span></div><span style="font-size:11px;color:var(--muted)">${isDone(n)?'أحسنتِ، الدرس مكتمل':'حددي إكمال الدرس بعد الانتهاء'}</span></section>${mediaBlock(l)}<section class="aside-card"><h3>المصادر والمرجع</h3>${sourcesBlock(l)}</section><section class="aside-card"><h3>حالة المحتوى</h3><span class="chip tiny red">مسودة تعليمية</span><p style="margin-top:10px">تمت صياغة الشرح للنسخة التجريبية، ويحتاج تدقيقًا قبل اعتباره محتوى نهائيًا.</p></section></aside></div>`}
function flashcardsPage(){const cards=[['قف','يجب التوقف التام ثم العبور عندما يسمح التنظيم وتتوفر السلامة.'],['أعطِ الأفضلية','خففي السرعة وأفسحي المجال لمن له الأفضلية، وتوقفي عند الحاجة.'],['النقطة العمياء','منطقة قد لا تظهر بالكامل في المرايا، وتحتاج تحققًا مباشرًا آمنًا.'],['مسافة التوقف','مسافة رد الفعل + مسافة الفرملة.'],['الدوار','في الدوار المعتاد، الأولوية للمركبات التي تسير داخله.'],['النور العالي','يستخدم عندما تسمح الظروف دون إبهار المركبات الأخرى.'],['الخط المتقطع','قد يسمح بعبوره إذا كانت المناورة مسموحة وآمنة.'],['الركن P','وضع ناقل الحركة للركن، وليس مرادفًا لفرامل التوقف.'],['Brake Hold','مساعدة على تثبيت الفرامل وقت التوقف المؤقت، لا بدلًا عن تأمين ركن السيارة.'],['القيادة الوقائية','ألاحظ ← أتوقع ← أقرر ← أتصرف.'],['إشارة خضراء','تسمح بالحركة ضمن التنظيم دون إغلاق تقاطع مزدحم.'],['الرخصة','حجز أبشر ليس إصدارًا تلقائيًا للرخصة؛ هناك متطلبات وفحوص واختبارات.']];return `<div class="eyebrow">ACTIVE RECALL</div><h1 class="page-title">بطاقات تثبيت المعلومات</h1><p class="sub">حاولي تسترجعين المعنى من ذاكرتك أولًا، ثم اضغطي البطاقة لتظهر الإجابة. 12 بطاقة مفاهيمية سريعة.</p><div class="flashcards">${cards.map(([a,b],i)=>`<button type="button" class="flashcard ${flashFlips.has(i)?'flipped':''}" data-action="flip" data-id="${i}" aria-label="قلب بطاقة ${ESC(a)}"><span class="fc-title">${ESC(flashFlips.has(i)?b:a)}</span><span class="fc-hint">${flashFlips.has(i)?'اضغطي للعودة للسؤال':'اضغطي لإظهار الإجابة'} ${icon('reset')}</span></button>`).join('')}</div>${footerNote()}`}

function notesPage(){const entries=Object.keys(state.notes).map(Number).filter(n=>state.notes[n]?.trim()).sort((a,b)=>a-b);const marks=state.bookmarks.filter(n=>n>=1&&n<=48);return `<div class="eyebrow">MY NOTEBOOK</div><h1 class="page-title">دفتر مذاكرتي</h1><p class="sub">كلامك وملاحظاتك على الدروس، والموضوعات التي حفظتيها للمراجعة لاحقًا.</p><div class="section-head"><h2>دروس محفوظة (${marks.length})</h2></div><div class="card">${marks.length?marks.map(n=>`<a class="lesson-row" href="#/lesson/${n}"><span class="lesson-no">${p2(n)}</span><span class="lesson-info"><b>${ESC(getLesson(n).title)}</b><small>الأسبوع ${weekForLesson(n)}</small></span>${icon('star')}</a>`).join(''):'<div class="empty">ما حفظتِ أي درس للمراجعة. اضغطي «حفظ للمراجعة» من داخل أي درس.</div>'}</div><div class="section-head"><h2>ملاحظاتي (${entries.length})</h2></div>${entries.length?entries.map(n=>`<div class="ref-card"><div class="flexline"><h3>${ESC(getLesson(n).title)}</h3><a class="inline-link" href="#/lesson/${n}">فتح الدرس ←</a></div><p style="white-space:pre-wrap">${ESC(state.notes[n])}</p></div>`).join(''):'<div class="empty">دفترك لسه فاضي. اكتبي أول ملاحظة من داخل الدروس.</div>'}${footerNote()}`}
function quizPage(){const options=weeks.map(w=>`<option value="${w.number}">${w.number} — ${ESC(w.title)}</option>`).join(''); const wrong=Object.entries(state.answers).filter(([id,v])=>{const q=questions.find(q=>q.id===id);return q&&q.correct_option_index!==v}).length;return `<div class="eyebrow">KNOWLEDGE CHECK</div><h1 class="page-title">مركز الاختبارات</h1><p class="sub">اختاري أسبوعًا لتختبري ثلاثة مفاهيم، أو خوضي اختبارًا شاملًا من 12 سؤالًا متنوعة من المنهج. جميع الدرجات للتدريب الشخصي فقط.</p><div class="quiz-controls"><button class="btn btn-primary" type="button" data-action="start-quiz" data-week="all">اختبار شامل · 12 سؤالًا ${icon('arrow')}</button><button class="btn btn-muted" type="button" data-action="start-quiz" data-week="wrong" ${wrong===0?'disabled':''}>راجعي الأخطاء (${wrong})</button><select class="select" id="choose-week" aria-label="اختيار أسبوع للاختبار"><option value="">اختبار أسبوع معين...</option>${options}</select></div><div id="quiz-stage">${renderQuizStage()}</div><div class="section-head"><div><h2>مراجعة الأسئلة على مستوى الدروس</h2><p>كل درس يحتوي سؤالًا خاصًا به وتفسيرًا بعد الإجابة.</p></div><a href="#/weeks">خطة الدروس ←</a></div>${footerNote()}`}
function renderQuizStage(){if(!session){let hist=state.history.slice(-4).reverse();return `<div class="card"><div class="flexline"><h3>ابدئي اختبارك التالي</h3><span class="chip blue">${icon('quiz')} تمهيد</span></div><p class="sub" style="margin-top:10px">إذا ظهرت لك إجابة خطأ، سترين السبب فورًا. والاختبار الأسبوعي من ثلاث أسئلة، بينما الاختبار الشامل يختار 12 سؤالًا من الأسابيع المختلفة.</p>${hist.length?`<div class="section-head"><h2>المحاولات الأخيرة</h2></div>${hist.map(h=>`<div class="lesson-row"><span class="lesson-no">${h.score}/${h.total}</span><span class="lesson-info"><b>${ESC(h.label)}</b><small>${ESC(h.date)}</small></span></div>`).join('')}`:''}</div>`}
if(session.index>=session.ids.length){const score=session.ids.filter(id=>session.answers[id]===questions.find(q=>q.id===id).correct_option_index).length;const total=session.ids.length;return `<div class="test-results"><div class="eyebrow">RESULTS / النتيجة</div><div class="score">${score}<span style="font-size:30px;color:var(--fog)"> / ${total}</span></div><h2>${score===total?'أبدعتي! كل الإجابات صحيحة.':score>=total*.7?'شغل ممتاز، وراجعي بعض النقاط.':'المهم تعرفين سبب الخطأ وتراجعينه.'}</h2><p>هذه درجة تدريبية داخل الموقع، وليست درجة نجاح رسمية للرخصة.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px"><button class="btn btn-primary" type="button" data-action="quiz-restart">إعادة الاختبار</button><button class="btn btn-outline" type="button" data-action="quiz-end">العودة للمركز</button></div></div>`}
const q=questions.find(x=>x.id===session.ids[session.index]), ans=session.answers[q.id], answered=Number.isInteger(ans),correct=ans===q.correct_option_index;return `<div class="quiz-layout"><div class="test-card"><div class="flexline"><span class="test-index">سؤال ${p2(session.index+1)} من ${p2(session.ids.length)}</span><span class="chip tiny blue">الأسبوع ${q.week}</span></div><div class="microbar" style="margin:18px 0 9px"><span style="width:${session.index/session.ids.length*100}%"></span></div><h2>${ESC(q.question)}</h2><div class="options">${q.options.map((t,i)=>`<button type="button" class="option ${answered?(i===q.correct_option_index?'correct':i===ans?'wrong':''):''}" data-action="test-answer" data-choice="${i}" ${answered?'disabled':''}><span class="bullet">${p2(i+1)}</span>${ESC(t)}</button>`).join('')}</div>${answered?`<div class="feedback ${correct?'':'wrong'}"><strong>${correct?'ممتاز، صحيح.':'الإجابة الصحيحة موضحة بالأخضر.'}</strong> ${ESC(q.rationale)}</div>`:''}<div class="lesson-footer"><span class="note-preview">اسألي نفسك: ليش هذا الخيار أفضل من البقية؟</span><button type="button" class="btn btn-primary" data-action="quiz-next" ${answered?'':'disabled'}>${session.index+1===session.ids.length?'اعرضي النتيجة':'السؤال التالي'} ${icon('arrow')}</button></div></div><div class="aside-card"><h3>تفاصيل الاختبار</h3><p>${ESC(session.label)}</p><div class="microbar"><span style="width:${Math.round(session.index/session.ids.length*100)}%"></span></div><p>${session.ids.length} سؤالًا · يصحح كل سؤال عند الإجابة</p><button type="button" class="btn btn-outline" data-action="quiz-end">إنهاء الجلسة</button></div></div>`}
function settingsPage(){return `<div class="eyebrow">YOUR SPACE</div><h1 class="page-title">إعدادات المذاكرة</h1><p class="sub">قاعدة البيانات المستخدمة IndexedDB محلية داخل هذا المتصفح، دون حساب أو قاعدة بيانات سحابية؛ لا توجد مزامنة بين الأجهزة.</p><section class="card settings-card"><h3>حفظ المذاكرة على هذا الكمبيوتر</h3><p>يُحفظ تقدمك وآخر درس قرأتِه ومكان وصولك في الصفحة تلقائيًا داخل المتصفح نفسه. عند العودة اضغطي «ارجعي لآخر درس» من الرئيسية.</p><div class="settings-actions"><button type="button" class="btn btn-outline" data-action="persist-storage">طلب حماية بيانات الموقع من الحذف التلقائي</button></div><p class="note-preview">التخزين قد يُحذف يدويًا أو بسياسات المتصفح؛ احتفظي بنسخة احتياطية. لا يتزامن Chrome وEdge.</p><h3>النسخ الاحتياطي</h3><p class="note-preview" id="db-status">${ESC(databaseStatus)}</p><p>حملي ملف بياناتك لحفظ علامات إنجاز الدروس والإجابات والملاحظات، أو أعيدي استيراده على نفس الجهاز أو جهاز آخر.</p><div class="settings-actions"><button type="button" class="btn btn-primary" data-action="export">${icon('download')} تصدير تقدمي (JSON)</button><button type="button" class="btn btn-outline" data-action="import">استيراد نسخة احتياطية</button><input type="file" id="import-file" accept="application/json,.json" hidden></div></section><section class="card settings-card"><h3>ماذا يتضمن هذا الإصدار؟</h3><div class="point"><i>1</i>48 درسًا قصيرًا، بصياغات تعليمية أولية تحتاج تدقيقًا قبل النشر العام.</div><div class="point"><i>2</i>48 سؤالًا تدريبيًا مع تفسير، و12 بطاقة مراجعة.</div><div class="point"><i>3</i>البيانات منظمة داخل IndexedDB (دروس، أسئلة، ملاحظات، تقدم، اختبارات). لا توجد مزامنة سحابية.</div><div class="point"><i>4</i>ليس فيه خطوات أزرار دقيقة لأكورد دون معرفة سنة الموديل والفئة.</div></section><section class="card settings-card"><h3>البدء من جديد</h3><p>حذف البيانات المحلية سيزيل العلامات والإجابات والملاحظات الموجودة على هذا المتصفح. حملي نسخة احتياطية أولًا إذا احتجتيها.</p><button type="button" class="btn btn-outline" data-action="clear" style="color:var(--crimson)">حذف تقدم هذا المتصفح</button></section>${footerNote()}`}
function notFound(){return `<div class="empty"><h3>الصفحة غير موجودة</h3><p>ممكن ترجعين للرئيسية وتتابعين من هناك.</p><a href="#/home" class="btn btn-primary">العودة للرئيسية</a></div>`}
function resolvePage(){const r=route();if(r==='/home')return ['الرئيسية',home()];if(r==='/weeks')return ['الخطة الدراسية',weeksPage()];if(r.startsWith('/week/')){const n=Number(r.split('/')[2]);return ['الأسبوع '+n,weekPage(n)]}if(r.startsWith('/lesson/')){const n=Number(r.split('/')[2]);return ['الدرس '+n,lessonPage(n)]}if(r==='/quiz')return ['الاختبارات',quizPage()];if(r==='/cards')return ['بطاقات المراجعة',flashcardsPage()];if(r==='/notes')return ['ملاحظاتي',notesPage()];if(r==='/visuals')return ['المكتبة المرئية',visualLibraryPage()];if(r==='/sources')return ['المصادر',sourcesPage()];if(r==='/settings')return ['الإعدادات',settingsPage()];return ['غير موجودة',notFound()]}
function timerHTML(){return `<div class="floating-timer" aria-label="مؤقت مذاكرة"><span style="font-size:11px;color:var(--steel);font-weight:850">${icon('clock')}</span><b id="timer-text">${p2(Math.floor(timer.seconds/60))}:${p2(timer.seconds%60)}</b><button type="button" data-action="timer-toggle" aria-label="${timer.active?'إيقاف المؤقت':'بدء المؤقت'}">${icon(timer.active?'pause':'play')}</button><button type="button" data-action="timer-reset" aria-label="إعادة ضبط المؤقت">${icon('reset')}</button></div>`}
function render(keepScroll=false){const [title,content]=resolvePage();APP.innerHTML=`${sidebar()}<div class="mobile-backdrop ${mobileOpen?'open':''}" data-action="menu"></div><main class="app-main" id="main">${topbar(title)}<div class="page">${content}</div></main>${timerHTML()}`;if(!keepScroll)window.scrollTo(0,0);document.title=`${title} | مِسار`;displayedRoute=route();updateTimer();if(!keepScroll&&route()==='/home')animateStats()}
function animateStats(){if(!window.matchMedia||!document.querySelectorAll||typeof performance==='undefined'||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;document.querySelectorAll('.stat .val[data-count-value]').forEach(el=>{const to=Number(el.dataset.countValue);if(!to||to>100)return;const begin=performance.now(),duration=650;function frame(t){if(!el.isConnected)return;const k=Math.min((t-begin)/duration,1);el.textContent=Math.round(to*(1-(1-k)**3));if(k<1)requestAnimationFrame(frame)}requestAnimationFrame(frame)})}
let toastTimer;function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),3100)}
function updateTimer(){const el=document.getElementById('timer-text');if(el)el.textContent=p2(Math.floor(timer.seconds/60))+':'+p2(timer.seconds%60)}
function startTest(week){let pool,label; if(week==='all'){pool=questions.map(q=>q.id); // seeded daily shuffle for consistent mix
 const bucket=Array.from({length:16},(_,i)=>questions.filter(q=>q.week===i+1));pool=bucket.flatMap((arr,i)=>arr[(Math.floor(i*7+Date.now()/86400000))%arr.length]?.id||arr[0]?.id).filter(Boolean);pool=pool.sort((a,b)=>((+a.match(/\d+/)[0]*13)%47)-((+b.match(/\d+/)[0]*13)%47)).slice(0,12);label='الاختبار الشامل · 12 سؤالًا';
} else if(week==='wrong'){pool=questions.filter(q=>state.answers[q.id]!==undefined&&state.answers[q.id]!==q.correct_option_index).map(q=>q.id);label='مراجعة الأخطاء';}
else{const n=Number(week);pool=questions.filter(q=>q.week===n).map(q=>q.id);label=`اختبار الأسبوع ${n}`}
if(!pool.length){toast('ما عندك أسئلة في هذه المجموعة الآن');return}session={ids:pool,label,index:0,answers:{},saved:false};if(route()!='/quiz'){location.hash='#/quiz'}else render(true)}
function recordTest(){if(!session||session.saved)return;const score=session.ids.filter(id=>session.answers[id]===questions.find(q=>q.id===id).correct_option_index).length;state.history.push({label:session.label,score,total:session.ids.length,date:new Date().toLocaleDateString('ar-SA')});state.history=state.history.slice(-30);session.saved=true;save()}
function eventClick(e){let el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,n=Number(el.dataset.id);
 if(action==='persist-storage'){if(!navigator.storage?.persist){toast('المتصفح لا يدعم طلب تثبيت التخزين؛ احفظي نسخة احتياطية');return}navigator.storage.persist().then(granted=>toast(granted?'المتصفح وافق على التخزين المستمر في هذا الجهاز':'المتصفح لم يمنح ضمانًا ضد الحذف التلقائي')).catch(()=>toast('لم نتمكن من طلب التخزين المستمر'));return}
 if(action==='video-load'){const id=el.dataset.video;if(!/^[A-Za-z0-9_-]{11}$/.test(id))return;const holder=el.closest('.video-player');if(!holder)return;const iframe=document.createElement('iframe');iframe.src='https://www.youtube-nocookie.com/embed/'+id;iframe.title=el.dataset.title||'فيديو تعليمي في القيادة';iframe.loading='lazy';iframe.setAttribute('allow','encrypted-media; picture-in-picture; fullscreen');iframe.setAttribute('allowfullscreen','');iframe.referrerPolicy='strict-origin-when-cross-origin';holder.replaceChildren(iframe);return}
 if(action==='visual-step'){const id=el.dataset.visual;const v=(COURSE.learning_visuals||[]).find(x=>x.id===id);if(v){visualStages[id]=Math.max(0,Math.min(v.steps.length-1,Number(el.dataset.step)||0));render(true);document.querySelector?.('[data-action="visual-step"][data-visual="'+id+'"][data-step="'+visualStages[id]+'"]')?.focus?.({preventScroll:true});document.getElementById('visual-learning')?.scrollIntoView({block:'nearest'});}return}
 if(action==='filter-weeks'){catalogFilter=el.dataset.filter||'all';render(true);return}
 if(action==='menu'){mobileOpen=!mobileOpen;render(true);return}
 if(action==='scroll'){document.getElementById(el.dataset.target)?.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(action==='mark'){const s=new Set(state.done);s.has(n)?s.delete(n):s.add(n);state.done=[...s].sort((a,b)=>a-b);save();render(true);toast(isDone(n)?'تم حفظ إنجاز الدرس':'أزلنا علامة الإكمال');return}
 if(action==='bookmark'){const s=new Set(state.bookmarks);s.has(n)?s.delete(n):s.add(n);state.bookmarks=[...s];save();render(true);return}
 if(action==='lesson-answer'){const q=getQuestion(n),choice=Number(el.dataset.choice);if(state.answers[q.id]===undefined){state.answers[q.id]=choice;save();render(true);const a=document.getElementById('practice');a?.scrollIntoView({behavior:'instant',block:'center'})}return}
 if(action==='flip'){flashFlips.has(n)?flashFlips.delete(n):flashFlips.add(n);render(true);return}
 if(action==='start-quiz'){startTest(el.dataset.week);return}
 if(action==='test-answer'){if(session){const q=questions.find(x=>x.id===session.ids[session.index]);if(session.answers[q.id]===undefined){session.answers[q.id]=Number(el.dataset.choice);state.answers[q.id]=Number(el.dataset.choice);save();render(true)}}return}
 if(action==='quiz-next'){if(session){session.index++;if(session.index>=session.ids.length)recordTest();render(true)}return}
 if(action==='quiz-restart'){const old=session;if(old){const which=old.label.startsWith('اختبار الأسبوع')?String(questions.find(q=>q.id===old.ids[0]).week):old.label.includes('الأخطاء')?'wrong':'all';startTest(which)}return}
 if(action==='quiz-end'){session=null;render(true);return}
 if(action==='timer-toggle'){timer.active=!timer.active;render(true);toast(timer.active?'بدأت جلسة التركيز':'تم إيقاف المؤقت');return}
 if(action==='timer-reset'){timer.active=false;timer.seconds=1800;render(true);return}
 if(action==='export'){const data=JSON.stringify({format:'masar-progress-v1',exportedAt:new Date().toISOString(),state},null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='masar-my-progress.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('تم تجهيز نسخة بياناتك الاحتياطية');return}
 if(action==='import'){document.getElementById('import-file')?.click();return}
 if(action==='clear'){if(confirm('سيتم حذف تقدم الدروس والإجابات وملاحظاتك في هذا المتصفح فقط. هل أنت متأكدة؟')){state={done:[],answers:{},notes:{},bookmarks:[],history:[],lastOpened:1,visited:[],readingPositions:{}};save();render(true);toast('تمت إعادة التقدم للبداية')}return}
}
document.addEventListener('click',e=>{if(e.target.closest('.skip')){e.preventDefault();document.getElementById('main')?.focus();return}if(e.target.closest('[data-action]'))eventClick(e);else if(e.target.closest('.sidebar a'))mobileOpen=false});
document.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||!window.matchMedia||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const card=e.target.closest('.card-premium-interactive');if(!card)return;const rect=card.getBoundingClientRect();card.style.setProperty('--mx',((e.clientX-rect.left)/rect.width*100).toFixed(1)+'%');card.style.setProperty('--my',((e.clientY-rect.top)/rect.height*100).toFixed(1)+'%')},{passive:true});
document.addEventListener('input',e=>{if(e.target.id==='catalog-search'){filterText=e.target.value;const el=document.getElementById('week-catalog');if(el)el.innerHTML=weeksGrid();}if(e.target.dataset.note){state.notes[e.target.dataset.note]=e.target.value;save()}});
document.addEventListener('change',async e=>{if(e.target.id==='choose-week'&&e.target.value){startTest(e.target.value)}if(e.target.id==='import-file'&&e.target.files?.[0]){try{const obj=JSON.parse(await e.target.files[0].text());if(obj.format!=='masar-progress-v1'||!obj.state||!Array.isArray(obj.state.done))throw Error('Invalid');if(confirm('هل تريدين استبدال تقدم هذا المتصفح بالنسخة المستوردة؟')){state={...state,...obj.state};save();render(true);toast('تم استيراد البيانات')}}catch(err){toast('ملف غير صالح لاستيراد تقدم مِسار')}}});
function lessonNumberFromRoute(path){const m=/^\/lesson\/(\d+)$/.exec(path||'');const n=Number(m?.[1]);return n>=1&&n<=48?n:null}
function captureReadingPosition(path=displayedRoute){const n=lessonNumberFromRoute(path);if(!n||restoringScroll)return;const y=Math.max(0,Math.round(window.scrollY||document.documentElement?.scrollTop||0));state.readingPositions=state.readingPositions||{};if(state.readingPositions[n]!==y){state.readingPositions[n]=y;save()}}
function restoreReadingPosition(){const n=lessonNumberFromRoute(route());if(!n)return;const y=Number(state.readingPositions?.[n])||0;if(y<=0)return;restoringScroll=true;requestAnimationFrame(()=>{window.scrollTo(0,y);requestAnimationFrame(()=>{restoringScroll=false})})}
window.addEventListener('scroll',()=>{if(!lessonNumberFromRoute(displayedRoute)||restoringScroll)return;clearTimeout(scrollWriteTimer);scrollWriteTimer=setTimeout(()=>captureReadingPosition(),600)},{passive:true});
window.addEventListener('hashchange',()=>{clearTimeout(scrollWriteTimer);captureReadingPosition(displayedRoute);mobileOpen=false;render();restoreReadingPosition();if(location.hash==='#main'){document.getElementById('main')?.focus()}});
window.addEventListener('pagehide',()=>{clearTimeout(scrollWriteTimer);captureReadingPosition()});
window.addEventListener('storage',e=>{if(e.key===baseKey){try{state={...state,...JSON.parse(e.newValue||'{}')};render(true)}catch(_){}}});
tickInterval=setInterval(()=>{if(timer.active){if(timer.seconds>0)timer.seconds--;updateTimer();if(timer.seconds===0){timer.active=false;toast('خلصت جلسة الـ30 دقيقة، خذي استراحة قصيرة ✨');render(true)}}},1000);
render();restoreReadingPosition();
if(window.MasarDB){
  window.MasarDB.seedReference(COURSE).then(() => window.MasarDB.loadUser()).then(saved => {
    databaseReady=true; databaseStatus='قاعدة IndexedDB جاهزة · حفظ محلي على هذا الجهاز';
    // Preserve edits made in the current page or existing localStorage progress.
    if(!savedMirrorPresent && !dirtyBeforeReady && saved){
      state={...state,...saved};
      try{localStorage.setItem(baseKey,JSON.stringify(state))}catch(_){}
      render(true);restoreReadingPosition();
    } else {
      save();
    }
    const status=document.getElementById('db-status');if(status)status.textContent=databaseStatus;
  }).catch(e=>{databaseStatus='IndexedDB غير متاحة · تم استخدام التخزين الاحتياطي المحلي';console.warn('MASAR database unavailable',e);const el=document.getElementById('db-status');if(el)el.textContent=databaseStatus;});
}
})();
</script>
</body></html>
